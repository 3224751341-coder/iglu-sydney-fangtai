name: Update Iglu Fangtai

on:
  schedule:
    - cron: '0 * * * *'      # 每小时 0 分（北京 08:00~23:00 每小时）
  push:
    branches: [main]
    paths:
      - 'update_fangtai.py'
      - 'template.html'
      - '.github/workflows/update.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape, Diff and Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ef0a1a33b94f19c47fb3f9e2737f9214
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python update_fangtai.py
