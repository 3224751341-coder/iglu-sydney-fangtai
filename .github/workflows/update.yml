name: Update Iglu Fangtai

on:
  schedule:
    # GitHub 整点（:00）cron 最拥堵、常被延迟甚至丢弃（实测近一周每小时 1 个点仅触发 5~7 次/天），
    # 改成每小时两个错峰点提高触发率；脚本侧已有去重（数据变化才部署 / 页龄>4h 心跳），多触发无副作用
    - cron: '13 * * * *'
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - 'update_fangtai.py'
      - 'template.html'
      - 'deploy_uhouzz.py'
      - 'container/server.mjs'
      - 'container/Dockerfile'
      - 'container/platform.yaml'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个：定时 + 手动/看门狗补跑撞在一起时，两个 run 会各自读到同一份待发队列、各发一遍
concurrency:
  group: update-iglu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Scrape, Diff and Deploy
        env:
          DEPLOY_KEY: ${{ secrets.UHOUZZ_DEPLOY_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
        # push 触发（代码变更）或手动勾选 force 时强制重新部署——渲染/容器逻辑修复可能不影响快照数据但影响页面
        run: python update_fangtai.py ${{ (github.event_name == 'push' || inputs.force == true) && '--force' || '' }}

      - name: Commit snapshot back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # wecom_queue*.json 用通配符：以后在 RECIPIENTS 里加新城市机器人，新的队列文件
          # （wecom_queue_xxx.json）会自动被提交，不用再改这个 workflow 文件
          git add data_snapshot.json container/public/index.html wecom_queue*.json
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update data snapshot [skip ci]"
            git push
          fi

      # 2026-09-28：脚本一开头就把静默期攒的消息发出去并清空队列，但部署失败时上一步不执行，
      # 清空后的队列没提交回仓库 → 下一轮又发同一条（09-27 一整天重复推送就是这么来的）。
      # 所以失败时也要单独把队列文件提交回去；快照/页面不提交，等部署成功那轮再正常对比推送。
      - name: Commit WeCom queue even on failure
        if: failure() || cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wecom_queue*.json
          if git diff --cached --quiet; then
            echo "队列无变化，跳过提交"
          else
            git commit -m "chore: save wecom queue after failed run [skip ci]"
            git push
          fi
