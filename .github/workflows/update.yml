name: Update Iglu Fangtai

on:
  schedule:
    - cron: '0 * * * *'      # 每小时 0 分（北京 08:00~23:00 每小时）
  push:
    branches: [main]
    paths:
      - 'update_fangtai.py'
      - 'template.html'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape, Diff and Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ef0a1a33b94f19c47fb3f9e2737f9214
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        # push 触发（代码变更）时强制重新部署——渲染逻辑修复可能不影响快照数据但影响 HTML
        run: python update_fangtai.py ${{ github.event_name == 'push' && '--force' || '' }}

      - name: Commit snapshot back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update data snapshot [skip ci]"
            git push
          fi
