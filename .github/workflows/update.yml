name: Update Iglu Fangtai

on:
  schedule:
    # GitHub 整点（:00）cron 最拥堵、常被延迟甚至丢弃（实测近一周每小时 1 个点仅触发 5~7 次/天），
    # 改成每小时两个错峰点提高触发率；脚本侧已有去重（数据变化才部署 / 页龄>4h 心跳），多触发无副作用
    - cron: '13 * * * *'
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - 'update_fangtai.py'
      - 'template.html'
      - 'deploy_uhouzz.py'
      - 'container/server.mjs'
      - 'container/Dockerfile'
      - 'container/platform.yaml'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install curl_cffi

      # 2026-09-09：Iglu 房态抓取已搬进 iglu-rate-desk 容器本身（每 30 分钟自跑一次，
      # 改用 Playwright 加载页面绕过 Cloudflare），这个 workflow 不再需要往 app.uhomes.com 部署——
      # 加 --no-deploy 只保留抓取 + 快照 diff + 企微通知，不再调用 deploy_uhouzz.py。
      - name: Scrape and Diff (no deploy)
        env:
          DEPLOY_KEY: ${{ secrets.UHOUZZ_DEPLOY_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
        run: python update_fangtai.py --no-deploy ${{ (github.event_name == 'push' || inputs.force == true) && '--force' || '' }}

      - name: Commit snapshot back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json container/public/index.html
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: update data snapshot [skip ci]"
            git push
          fi
